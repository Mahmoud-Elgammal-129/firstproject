<div class="register">
    <div class="text-center registhead">
        <h2>Register</h2>
    </div>
    <form [formGroup]="userform" (ngSubmit)="onSubmit()">
        <div class="row">
            <div class="col-md-6 col-sm-12">
                <mat-form-field appearance="outline" color="warn">
                    <mat-label>user Name</mat-label>
                    <input matInput type="text" formControlName="username"  placeholder="enter your name">
                  
                </mat-form-field>
            </div>
            <div class="col-md-6 col-sm-12">          
                <mat-form-field appearance="outline" color="warn">                    
                    <mat-label>email</mat-label>
                    <input matInput type="email" formControlName="email" placeholder="enter your email" >
                </mat-form-field>
            </div>

            <div class="col-md-6 col-sm-12">
                <mat-form-field appearance="outline" color="warn">
                    <mat-label> password</mat-label>
                    <input matInput type="password" formControlName="password"placeholder="enter your passwor" >
                </mat-form-field>
            </div>

            <div class="col-md-6 col-sm-12">             
                <mat-form-field appearance="outline" color="warn">
                    <mat-label>  confairm password</mat-label>
                    <input matInput type="password" formControlName="confirmPassword" placeholder="confairm password">
                </mat-form-field>
            </div>
        </div>
      <div class="text-right registfoot">
          <a routerLink="/login" color="primary">املك حساب بالفعل ؟</a>
            <button mat-raised-button type="submit" color="warn" [disabled]="userform.invalid || (userform.value.password !== userform.value.confirmPassword)" >انشاء الحساب</button>
      </div>
     </form>
</div>
