<body>
    <div class="subjectBox">
        <div class="row">
            <div class="col-md-3 col-sm-12" *ngFor="let item of subjects;let index=index"  routerLink="/exam/{{item.id}}">
                <div class="namesubject">
                    <div>{{item.name}}</div>
                </div>
                <div class="subBtn">
                   
                    <!-- *ngIf="user?.role == 'doctor'" -->
                    <!-- *ngIf="user?.role == 'doctor'" -->
                    <!-- *ngIf="user?.role == 'students'" -->
                 <button  mat-raised-button color="warn"   (click)="delete(index)" class="mx-1 btn btn-danger">حذف</button>
                 <button mat-raised-button color="primary"  class="mx-1 btn btn-primary">عرض</button>
                 <button  mat-raised-button class="mx-1 btn btn-success">ابدأ الاختبار</button>
                </div>
            </div>
        </div>
    </div>
</body>
